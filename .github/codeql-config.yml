name: signalman-codeql

# The vendored glib tree is an intentionally pinned upstream security
# backport. It is tracked and reviewed as dependency source, but it is not
# application code owned by this repository; scanning it creates duplicate
# upstream unsafe-pointer findings and blocks the PR on third-party code.
paths-ignore:
  - src-tauri/vendor/glib-0.18.5-signalman/**

# Rust's cleartext-logging query treats any data flow from the DPAPI helpers
# as a log sink, including the protected catalog write and the credential
# helper's required stdout response. These paths are deliberate protocol or
# encrypted-storage boundaries; keep the behavior covered by code review and
# the existing credential-handling tests instead of reporting them as logs.
query-filters:
  - exclude:
      id: rust/cleartext-logging
